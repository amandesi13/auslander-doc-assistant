[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auslander-doc-assistant"
version = "0.1.0"
description = "Privacy-first document assistant for international students and newcomers in Germany."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Amandeep Singh" }
]
keywords = ["germany", "international-students", "ocr", "documents", "bureaucracy", "privacy"]
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "PyMuPDF>=1.24",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "Pillow>=10.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
auslander-doc = "auslander_doc_assistant.cli:main"
auslander-doc-web = "auslander_doc_assistant.web_app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/auslander_doc_assistant"]
